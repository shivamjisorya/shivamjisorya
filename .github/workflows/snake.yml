name: Contribution snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#e50914&color_dots=#ebedf0,#ffc7c7,#ff7b7b,#e50914,#8a0008
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e50914&color_dots=#161b22,#4a0a0d,#8a0008,#c4161c,#ff3b45

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
