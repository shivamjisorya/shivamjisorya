<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="330" viewBox="0 0 1200 330">
<style>
@font-face{font-family:A;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:I;font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}
.a{font-family:A,Impact,'Arial Narrow',sans-serif}
.i{font-family:I,'Segoe UI',Helvetica,Arial,sans-serif}
.q{font-family:Q,Georgia,serif;font-style:italic}
.up{animation:up .9s cubic-bezier(.22,1,.36,1) both}
.fade{animation:fade 1.2s ease both}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes slide{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs><clipPath id="r"><rect width="1200" height="330" rx="18"/></clipPath>
<radialGradient id="g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e50914" stop-opacity=".35"/><stop offset="1" stop-color="#e50914" stop-opacity="0"/></radialGradient>
<linearGradient id="t" x1="0" y1="0" x2="0" y2="1"><stop offset=".4" stop-color="#fff"/><stop offset="1" stop-color="#e8d9c0"/></linearGradient></defs>
<g clip-path="url(#r)"><rect width="1200" height="330" fill="#0c0b10"/><ellipse cx="600" cy="160" rx="520" ry="190" fill="url(#g)"/>
<g class="fade"><rect x="478" y="58" width="26" height="3" fill="#e50914"/><text x="514" y="64" class="i" font-size="13" font-weight="800" fill="#e50914" letter-spacing="5">THE NEXT EPISODE</text></g>
<text x="600" y="190" text-anchor="middle" class="a up" font-size="120" fill="url(#t)" style="animation-delay:0.15s">TO BE CONTINUED...</text>
<text x="600" y="240" text-anchor="middle" class="i up" font-size="19" font-weight="800" fill="#fff" letter-spacing="7" style="animation-delay:0.35s">SHIVAM JISORYA</text>
<text x="600" y="268" text-anchor="middle" class="i up" font-size="12" font-weight="600" fill="#7d7a86" letter-spacing="5" style="animation-delay:0.45s">SOFTWARE DEVELOPMENT ENGINEER · GURUGRAM, INDIA</text>
</g>
</svg>