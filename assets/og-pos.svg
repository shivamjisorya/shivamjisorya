<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="380" height="540" viewBox="0 0 380 540">
<style>
@font-face{font-family:A;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:I;font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}
.a{font-family:A,Impact,'Arial Narrow',sans-serif}
.i{font-family:I,'Segoe UI',Helvetica,Arial,sans-serif}
.q{font-family:Q,Georgia,serif;font-style:italic}
.up{animation:up .9s cubic-bezier(.22,1,.36,1) both}
.fade{animation:fade 1.2s ease both}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes slide{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs><clipPath id="r"><rect width="380" height="540" rx="16"/></clipPath>
<radialGradient id="g" cx="70%" cy="22%" r="75%"><stop offset="0" stop-color="#8a3ffc"/><stop offset=".7" stop-color="#8a3ffc" stop-opacity="0"/></radialGradient>
<linearGradient id="v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#170830"/><stop offset=".95" stop-color="#0c0b10"/></linearGradient>
<filter id="gl"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#8a3ffc"/></filter></defs>
<g clip-path="url(#r)">
<rect width="380" height="540" fill="url(#v)"/><rect width="380" height="540" fill="url(#g)"/>
<rect x=".5" y=".5" width="379" height="539" rx="16" fill="none" stroke="#fff" stroke-opacity=".1"/>
<text x="24" y="44" class="a" font-size="22" fill="#e50914">S</text>
<text x="40" y="42" class="i" font-size="11" font-weight="800" fill="#fff" letter-spacing="3">ORIGINAL</text>
<rect x="306" y="26" width="50" height="22" rx="3" fill="none" stroke="#fff" stroke-opacity=".4"/>
<text x="331" y="41" text-anchor="middle" class="i" font-size="10" font-weight="800" fill="#fff" letter-spacing="1">NEW</text>
<g transform="translate(80 70)" class="fade" style="animation-delay:0.2s"><g fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)"><rect x="66" y="56" width="36" height="36" rx="5"/><rect x="118" y="56" width="36" height="36" rx="5"/><rect x="66" y="108" width="36" height="36" rx="5"/><rect x="118" y="108" width="36" height="36" rx="5"/></g></g>
<text x="24" y="330" class="i" font-size="10.5" font-weight="800" fill="#fff" fill-opacity=".7" letter-spacing="2">MULTI-TENANT · OFFLINE-FIRST</text>
<text x="22" y="382" class="a up" font-size="52" fill="#fff" style="animation-delay:0.1s">POS</text><text x="22" y="432" class="a up" font-size="52" fill="#fff" style="animation-delay:0.2s">SOFTWARE</text>
<text x="24" y="470" class="i" font-size="13.5" font-weight="500" fill="#fff" fill-opacity=".75">Restaurant POS: React + Express,</text><text x="24" y="490" class="i" font-size="13.5" font-weight="500" fill="#fff" fill-opacity=".75">SQLite hub, MySQL cloud, Electron app.</text>
<rect x="24" y="502" width="332" height="2" fill="#fff" fill-opacity=".12"/>
<rect x="24" y="502" width="166" height="2" fill="#e50914" style="transform-origin:24px 0;animation:grow 1.8s .3s both"/>
</g>
</svg>