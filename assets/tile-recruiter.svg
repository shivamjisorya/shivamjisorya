<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="220" height="270" viewBox="0 0 220 270">
<style>
@font-face{font-family:A;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:I;font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}
.a{font-family:A,Impact,'Arial Narrow',sans-serif}
.i{font-family:I,'Segoe UI',Helvetica,Arial,sans-serif}
.q{font-family:Q,Georgia,serif;font-style:italic}
.up{animation:up .9s cubic-bezier(.22,1,.36,1) both}
.fade{animation:fade 1.2s ease both}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes slide{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs><linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6cc0de"/><stop offset="1" stop-color="#2b6f9e"/></linearGradient>
<clipPath id="c"><rect x="20" y="10" width="180" height="180" rx="12"/></clipPath>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<rect width="220" height="270" rx="14" fill="#0c0b10"/>
<g class="up">
  <g clip-path="url(#c)"><rect x="20" y="10" width="180" height="180" fill="url(#t)"/><text x="110" y="133.6" text-anchor="middle" class="a" font-size="96" fill="#fff" fill-opacity=".93">R</text><rect x="20" y="10" width="180" height="180" fill="url(#gl)"/></g>
  <text x="110" y="222" text-anchor="middle" class="i" font-size="19" font-weight="600" fill="#e5e5e5">Recruiter</text>
  <text x="110" y="248" text-anchor="middle" class="i" font-size="12" font-weight="500" fill="#8b8794">LinkedIn &amp; resume</text>
</g>
</svg>