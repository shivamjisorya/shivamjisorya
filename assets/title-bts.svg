<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="120" viewBox="0 0 1200 120">
<style>
@font-face{font-family:A;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:I;font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}
.a{font-family:A,Impact,'Arial Narrow',sans-serif}
.i{font-family:I,'Segoe UI',Helvetica,Arial,sans-serif}
.q{font-family:Q,Georgia,serif;font-style:italic}
.up{animation:up .9s cubic-bezier(.22,1,.36,1) both}
.fade{animation:fade 1.2s ease both}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes slide{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs><clipPath id="r"><rect width="1200" height="120" rx="14"/></clipPath>
<radialGradient id="g" cx="0%" cy="50%" r="60%"><stop offset="0" stop-color="#e50914" stop-opacity=".22"/><stop offset="1" stop-color="#e50914" stop-opacity="0"/></radialGradient></defs>
<g clip-path="url(#r)">
  <rect width="1200" height="120" fill="#0c0b10"/><rect width="1200" height="120" fill="url(#g)"/>
  <g style="animation:slide .8s cubic-bezier(.22,1,.36,1) both">
    <rect x="40" y="34" width="28" height="3" fill="#e50914"/>
    <text x="80" y="40" class="i" font-size="13" font-weight="800" fill="#e50914" letter-spacing="5">BEHIND THE SCENES</text>
  </g>
  <text x="38" y="100" class="a up" font-size="56" fill="#fff" style="animation-delay:0.15s">THE CONTRIBUTION STORY</text>
</g>
</svg>